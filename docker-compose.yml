services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: anomaly_pw
      POSTGRES_DB: anomaly_detection
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomaly -d anomaly_detection"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      # Internal listener for containers; external listener for host scripts.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /opt/kafka/data
    volumes:
      - kafkadata:/opt/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  mlflow:
    build: ./mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflowdata:/mlflow

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql://anomaly:anomaly_pw@db:5432/anomaly_detection
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      COPILOT_PROVIDER: ${COPILOT_PROVIDER:-none}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  feature-worker:
    build:
      context: .
      dockerfile: docker/streaming.Dockerfile
    image: anomaly-streaming:local
    profiles: ["app"]
    command: ["python", "-m", "faust", "-A", "streaming.feature_app", "worker", "-l", "info", "--without-web"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scoring-worker:
    build:
      context: .
      dockerfile: docker/streaming.Dockerfile
    image: anomaly-streaming:local
    profiles: ["app"]
    command: ["python", "-m", "faust", "-A", "streaming.scoring_app", "worker", "-l", "info", "--without-web"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://anomaly:anomaly_pw@db:5432/anomaly_detection
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
      args:
        VITE_API_URL: ""
    profiles: ["app"]
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: docker/seed.Dockerfile
    profiles: ["seed"]
    environment:
      DATABASE_URL: postgresql://anomaly:anomaly_pw@db:5432/anomaly_detection
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  replay:
    image: anomaly-streaming:local
    profiles: ["demo"]
    command: ["python", "streaming/replay.py", "--limit", "5000", "--delay-ms", "25"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  redisdata:
  kafkadata:
  mlflowdata:
